<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="/amatu.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Amatu Cut</title>
<meta name="description" content="Amatu Cut: editor video lengkap di browser. Template otomatis, transisi, lagu, teks, keyframe, edit suara, sampai ekspor 4K.">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311181f'/%3E%3Cpath d='M10 8l12 8-12 8z' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700;1,800&family=Montserrat:ital,wght@0,300;0,400;0,700;0,800;0,900;1,800&family=Roboto:wght@300;400;700;900&family=Nunito:wght@400;700;900&family=Raleway:wght@300;400;700;900&family=Quicksand:wght@400;700&family=Rubik:wght@400;700;800;900&family=Oswald:wght@400;700&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Bangers&family=Fredoka:wght@400;700&family=Righteous&family=Russo+One&family=Orbitron:wght@400;700;800;900&family=Monoton&family=Press+Start+2P&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,700&family=Cinzel:wght@400;600;700&family=Abril+Fatface&family=DM+Serif+Display&family=Pacifico&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Caveat:wght@400;700&family=Lobster&family=Permanent+Marker&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
<main id="home" hidden></main>

<div id="editor" hidden>
  <header class="topbar">
    <button class="ib" id="b-back" title="Kembali" aria-label="Kembali"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <input id="p-name" class="pname" aria-label="Nama proyek" spellcheck="false">
    <small id="save-st" class="save-st"></small>
    <div id="busy" class="busy" hidden><span class="spin"></span>Memproses suara</div>
    <div class="sp"></div>
    <button class="ib" id="b-undo" title="Urungkan (⌘Z)" aria-label="Urungkan" disabled><svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6 4 10l4 4"/><path d="M4 10h10a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="b-redo" title="Ulangi (⌘⇧Z)" aria-label="Ulangi" disabled><svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 4-4 4"/><path d="M20 10H10a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn primary" id="b-export"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7.500 8.500 12 4l4.500 4.500"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span>Ekspor</span></button>
  </header>

  <div class="work">
    <nav id="lib-rail" class="rail"></nav>
    <aside id="lib-panel" class="panel">
      <div class="sheet-head"><i class="grab"></i><button class="ib" data-close-sheet aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div id="lib-body" class="panel-body"></div>
    </aside>
    <section id="stage-area" class="stage-area">
      <div id="stage-wrap" class="stage-wrap">
        <canvas id="stage-cv"></canvas>
        <div id="stage-hint" class="stage-hint" hidden>
          <button id="b-add" class="add-big" aria-label="Tambah media"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <b>Tambahkan foto atau video</b><small>atau seret berkas ke mana saja di layar ini</small>
        </div>
      </div>
      <div class="transport">
        <div class="tc"><b id="t-cur">00:00:00</b><span>/</span><span id="t-dur">00:00</span></div>
        <div class="tp-btns">
          <button class="ib" id="b-start" title="Ke awal" aria-label="Ke awal"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M19 5l-10 7 10 7z"/></svg></button>
          <button class="ib" id="b-prev" title="Mundur 1 bingkai (←)" aria-label="Mundur satu bingkai"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="ib play" id="b-play" title="Putar (spasi)" aria-label="Putar"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M7 4.500v15l12-7.500z"/></svg></button>
          <button class="ib" id="b-next" title="Maju 1 bingkai (→)" aria-label="Maju satu bingkai"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
          <button class="ib" id="b-end" title="Ke akhir" aria-label="Ke akhir"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
        </div>
        <div class="tc-r"><button class="ib" id="b-full" title="Layar penuh" aria-label="Layar penuh"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      </div>
    </section>
    <aside id="insp" class="panel insp">
      <div class="sheet-head"><i class="grab"></i><button class="ib" data-close-sheet aria-label="Tutup"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <h3 id="insp-title" class="insp-title">Proyek</h3>
      <div id="insp-body" class="panel-body"></div>
    </aside>
  </div>

  <div id="tl-grip" class="tl-grip"></div>
  <div id="tl-tools" class="tl-tools"></div>
  <div id="tl-wrap" class="tl-wrap"><canvas id="tl-cv"></canvas></div>
  <div id="sheet-bg" class="sheet-bg" hidden></div>
  <div id="drop-veil" class="drop-veil" hidden><div>Lepaskan untuk menambah ke linimasa</div></div>
</div>

<script type="module" src="js/app.js?v=1"></script>
</body>
</html>
